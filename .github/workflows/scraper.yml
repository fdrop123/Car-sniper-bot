name: Car Sniper Bot

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum interval)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to scrape (space-separated)"
        required: false
        default: "autotrader ebay gumtree"
      dry_run:
        description: "Dry run (no Telegram notifications)"
        type: boolean
        required: false
        default: false

env:
  MIN_PRICE:     "300"
  MAX_PRICE:     "1500"
  MIN_YEAR:      "2006"
  RADIUS_MILES:  "60"
  POSTCODE:      "LU1 1AA"
  LOCATION:      "luton"
  MAX_PAGES:     "5"
  STORE_MAX_AGE_DAYS: "90"

jobs:
  scrape:
    name: Scrape & notify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache the seen_listings.json between runs so we never re-notify
      - name: Restore seen-listings cache
        uses: actions/cache@v4
        with:
          path: seen_listings.json
          key: seen-listings-${{ github.ref_name }}
          restore-keys: seen-listings-

      - name: Run scraper (scheduled)
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE:          ${{ env.MIN_PRICE }}
          MAX_PRICE:          ${{ env.MAX_PRICE }}
          MIN_YEAR:           ${{ env.MIN_YEAR }}
          RADIUS_MILES:       ${{ env.RADIUS_MILES }}
          POSTCODE:           ${{ env.POSTCODE }}
          LOCATION:           ${{ env.LOCATION }}
          MAX_PAGES:          ${{ env.MAX_PAGES }}
          STORE_MAX_AGE_DAYS: ${{ env.STORE_MAX_AGE_DAYS }}
        run: |
          python main.py \
            --sources autotrader ebay gumtree \
            --no-empty-summary

      - name: Run scraper (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE:          ${{ env.MIN_PRICE }}
          MAX_PRICE:          ${{ env.MAX_PRICE }}
          MIN_YEAR:           ${{ env.MIN_YEAR }}
          RADIUS_MILES:       ${{ env.RADIUS_MILES }}
          POSTCODE:           ${{ env.POSTCODE }}
          LOCATION:           ${{ env.LOCATION }}
          MAX_PAGES:          ${{ env.MAX_PAGES }}
          STORE_MAX_AGE_DAYS: ${{ env.STORE_MAX_AGE_DAYS }}
        run: |
          python main.py \
            --sources ${{ github.event.inputs.sources || 'autotrader ebay gumtree' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Always save the updated cache even if the scraper partially fails
      - name: Save seen-listings cache
        if: always()
        uses: actions/cache@v4
        with:
          path: seen_listings.json
          key: seen-listings-${{ github.ref_name }}-${{ github.run_id }}
